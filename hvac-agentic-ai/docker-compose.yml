version: "3.9"

services:
  # --- Small/fast model: Customer Outreach, Parts Recommendation ---
  vllm-fast:
    image: vllm/vllm-openai:latest
    container_name: vllm-fast
    command: >
      --model Qwen/Qwen2.5-1.5B-Instruct
      --served-model-name Qwen2.5-1.5B-Instruct
      --port 8000
      --gpu-memory-utilization 0.35
      --max-model-len 4096
      --max-num-seqs 16
    ports:
      - "8000:8000"
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    ipc: host

  # --- Reasoning model: Orchestrator, Diagnostic, Revenue Opportunity ---
  vllm-reason:
    image: vllm/vllm-openai:latest
    container_name: vllm-reason
    command: >
      --model Qwen/Qwen2.5-3B-Instruct
      --served-model-name Qwen2.5-3B-Instruct
      --port 8001
      --gpu-memory-utilization 0.5
      --max-model-len 8192
      --max-num-seqs 8
    ports:
      - "8001:8001"
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    ipc: host

  # --- Tool server: 18 tools (2 per agent) backed by the sample JSON data ---
  mcp-server:
    build: .
    container_name: mcp-server
    command: python3 mcp_server/server.py
    environment:
      - MCP_TRANSPORT=streamable-http
      - MCP_PORT=8010
    ports:
      - "8010:8010"

  # --- Orchestration API: what the chat UI talks to ---
  api:
    build: .
    container_name: hvac-agent-api
    command: uvicorn api.main:app --host 0.0.0.0 --port 8080
    environment:
      - MCP_URL=http://mcp-server:8010/mcp
      - MODEL_FAST_URL=http://vllm-fast:8000/v1
      - MODEL_FAST_NAME=Qwen2.5-1.5B-Instruct
      - MODEL_REASON_URL=http://vllm-reason:8001/v1
      - MODEL_REASON_NAME=Qwen2.5-3B-Instruct
    ports:
      - "8080:8080"
    depends_on:
      - mcp-server
      - vllm-fast
      - vllm-reason

# Notes for a 12GB RTX 4070:
#   0.35 + 0.5 = 0.85 of VRAM reserved for the two models, leaving headroom
#   for CUDA context overhead. Tune --gpu-memory-utilization down further if
#   you hit OOM, or drop --max-model-len before dropping model size.
